# Repository-wide operational settings.

[scheduling]
# true blocks every scheduled run; manual runs remain available. After changing,
# run `uv run python -m apps.operations.scheduling sync` and commit the workflows.
paused = false

[catalog]
# Publication settings; enabling this reuses accepted source descriptions.
include_scb_pxweb_v1 = false

[logging]
# Log level shared by every metadata adapter and the catalog build (all apps.* and
# retrieval.* loggers): DEBUG, INFO, WARNING, ERROR, or OFF to silence them.
level = "DEBUG"
