# Authoritative automatic harvesting schedules. Manual runs remain available.
# Edit this file, run `uv run --extra harvest python -m metadata_harvest.scheduling sync`,
# and commit this file with the generated workflow changes. CI rejects drift.
# Cron fields: minute hour day-of-month month day-of-week (0=Sunday).
# Numeric POSIX cron syntax: *, lists, ranges and steps. Times use this timezone.
timezone = "Europe/Stockholm"

[adapters.pxweb_v1]
enabled = true
[[adapters.pxweb_v1.schedules]]
cron = "15 4 * * 1-6"
mode = "incremental"
[[adapters.pxweb_v1.schedules]]
cron = "15 4 * * 0"
mode = "full" # Weekly complete refresh.

[adapters.pxweb_v2]
# Complete table acceptance verified 9 October 2026; dependency errors stay separate.
enabled = true
[[adapters.pxweb_v2.schedules]]
cron = "15 6 2-14,16-31 * *"
mode = "incremental"
[[adapters.pxweb_v2.schedules]]
cron = "15 6 1,15 * *"
mode = "full" # Twice a month: a complete SCB refresh takes hours.

[adapters.kolada]
enabled = true
[[adapters.kolada.schedules]]
cron = "30 6 * * *"
mode = "incremental" # Kolada intentionally has no full refresh mode.

[adapters.uka]
enabled = true
[[adapters.uka.schedules]]
cron = "15 5 * * 1"
mode = "incremental" # Unchanged indicators are reused; manual runs may pass full.

[adapters.sdb]
enabled = true
[[adapters.sdb.schedules]]
cron = "45 5 * * 1"
mode = "full" # Every run rebuilds every subject; SDB publishes no change signal.

[adapters.trafa]
enabled = true
[[adapters.trafa.schedules]]
cron = "15 6 * * 1"
mode = "full" # Every run rebuilds every dataset; Trafikanalys has no update signal.

[adapters.entrysoft]
enabled = true
[[adapters.entrysoft.schedules]]
cron = "30 6 1 * *"
mode = "incremental" # Only tables whose catalogue markers changed are reharvested.

[adapters.smhi_emissions]
enabled = true
[[adapters.smhi_emissions.schedules]]
cron = "30 7 3 * *"
mode = "full" # Monthly: every run rebuilds all 29 substances (30 requests); a new submission arrives each spring.

[adapters.forsakringskassan]
enabled = true
[[adapters.forsakringskassan.schedules]]
cron = "15 5 * * 2"
mode = "incremental" # Weekly: only reports whose meta.json or texts hash changed are rebuilt.
[[adapters.forsakringskassan.schedules]]
cron = "45 4 1 * *"
mode = "full" # Monthly complete rebuild, including the undeclared-dimension probes.

[adapters.riksbank]
enabled = true
[[adapters.riksbank.schedules]]
cron = "15 7 * * 1"
mode = "full" # Weekly full rebuild: 46 requests paced at 15 s (about 12 minutes); metadata changes rarely, forecasts 4-5 times a year

[adapters.dataanalys]
enabled = true
[[adapters.dataanalys.schedules]]
cron = "45 6 * * 1"
mode = "full" # Weekly full rebuild, about 140 requests at 1 request/s; the analysverktyg has no change signal for dimension categories

[adapters.tillvaxtverket]
enabled = true
[[adapters.tillvaxtverket.schedules]]
cron = "45 7 * * 1"
mode = "full" # Weekly Monday 07:45; every run probes every dataset (3 requests each) and rebuilds only those whose LOAD_DATE signal changed

# Editorial snapshot refresh is separate from statistical adapters/services.
[snapshots.oppnadata]
enabled = true
[[snapshots.oppnadata.schedules]]
cron = "30 3 * * 0"
mode = "full"
