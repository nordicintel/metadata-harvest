name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: "3.13"
      - run: uv sync --locked --extra harvest
      - run: uv run --extra harvest playwright install --with-deps chromium
      - run: uv run --extra harvest ruff format --check .
      - run: uv run --extra harvest ruff check .
      - run: uv run --extra harvest pytest
      - run: uv run --extra harvest python scripts/generate_schema_reference.py --check
      - run: uv build
      - run: uv run --extra harvest python scripts/check_distribution.py
