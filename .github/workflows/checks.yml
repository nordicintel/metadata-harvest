name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  live-progress:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.7'
          python-version: '3.13'
      - run: uv sync --locked
      - name: Read counters and an individual error before the test worker exits
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/check_live_progress.py
      - name: Close interrupted progress check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m metadata_harvest.monitor close --conclusion "${{ job.status == 'cancelled' && 'cancelled' || 'failure' }}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-progress-verification
          path: output/
          retention-days: 7
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: "3.13"
      - run: uv sync --locked --extra harvest
      - run: uv run --extra harvest playwright install --with-deps chromium
      - run: uv run --extra harvest ruff format --check .
      - run: uv run --extra harvest ruff check .
      - run: uv run python -m metadata_harvest.scheduling sync --check
      - name: Install 7-Zip for catalog tests
        run: sudo apt-get update && sudo apt-get install --yes 7zip
      - run: uv run --extra harvest pytest
      - run: uv run --extra harvest python scripts/generate_schema_reference.py --check
      - run: uv run --extra harvest python scripts/generate_configuration.py --check
      - run: uv build
      - run: uv run --extra harvest python scripts/check_distribution.py
