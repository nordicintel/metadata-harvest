name: Scheduled harvest

on:
  # BEGIN GENERATED SCHEDULE
  schedule:
    - cron: '15 4 * * 1-6'
      timezone: Europe/Stockholm
    - cron: '15 4 * * 0'
      timezone: Europe/Stockholm
  # END GENERATED SCHEDULE
  workflow_dispatch:
    inputs:
      full:
        description: Refresh all table metadata, including unchanged sources
        type: boolean
        default: false
      resume_run:
        description: Internal continuation ID; leave empty for normal manual runs
        required: false
        default: ''

# Automatic enablement is generated from schedules.toml.
# Manual runs remain available. HARVEST_PARALLEL_PROVIDERS defaults to 19.
concurrency:
  group: harvest-pxweb-v1
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    # BEGIN GENERATED ENABLEMENT
    if: github.event_name == 'workflow_dispatch' || true
    # END GENERATED ENABLEMENT
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.plan.outputs.run_id }}
      phase: ${{ steps.plan.outputs.phase }}
      wave: ${{ steps.plan.outputs.wave }}
      providers: ${{ steps.plan.outputs.providers }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
          python-version: "3.13"
      - run: uv sync --locked --extra harvest
      - id: plan
        env:
          EXPECTED_RUN_ID: ${{ inputs.resume_run }}
        run: uv run --extra harvest python -m metadata_harvest.runner prepare

  refresh:
    permissions:
      contents: read
      checks: write
    needs: prepare
    if: needs.prepare.outputs.skip == 'false' && needs.prepare.outputs.phase == 'refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.HARVEST_PARALLEL_PROVIDERS || '19') }}
      matrix:
        provider: ${{ fromJSON(needs.prepare.outputs.providers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
          python-version: "3.13"
      - run: uv sync --locked --extra harvest
      - run: uv run --extra harvest playwright install --with-deps chromium
      - name: Refresh provider listings
        timeout-minutes: 110
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER: ${{ matrix.provider }}
          RUN_ID: ${{ needs.prepare.outputs.run_id }}
        run: uv run --extra harvest python -m metadata_harvest.monitor run --name "pxweb_v1-refresh-$PROVIDER" -- python -m metadata_harvest.runner refresh --provider "$PROVIDER" --run-id "$RUN_ID"
      - name: Close interrupted progress check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m metadata_harvest.monitor close --conclusion "${{ job.status == 'cancelled' && 'cancelled' || 'failure' }}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telemetry-refresh-${{ matrix.provider }}-${{ github.run_attempt }}
          path: output/telemetry/
          if-no-files-found: warn
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refresh-${{ matrix.provider }}-${{ github.run_attempt }}
          path: output/provider/
          if-no-files-found: warn
          retention-days: 7

  collect-refresh:
    concurrency:
      group: production-publication
      queue: max
      cancel-in-progress: false
    needs: [prepare, refresh]
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.skip == 'false' && needs.prepare.outputs.phase == 'refresh'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      providers: ${{ steps.collect.outputs.providers }}
      wave: ${{ steps.collect.outputs.wave }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
          python-version: "3.13"
      - run: uv sync --locked --extra harvest
      - name: Resolve refresh mode from schedule or manual input
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
          MANUAL_FULL: ${{ inputs.full }}
        run: uv run python -m metadata_harvest.scheduling resolve --adapter pxweb_v1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: refresh-*-${{ github.run_attempt }}
          path: output/artifacts
      - id: collect
        env:
          RUN_ID: ${{ needs.prepare.outputs.run_id }}
        run: |
          args=()
          if [ "$FULL_REFRESH" = "true" ]; then args+=(--full); fi
          uv run --extra harvest python -m metadata_harvest.runner collect-refresh --run-id "$RUN_ID" "${args[@]}"
      - name: Commit inventory before metadata jobs start
        env:
          RUN_ID: ${{ needs.prepare.outputs.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run --extra harvest python -m metadata_harvest.runner publish --run-id "$RUN_ID"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refresh-checkpoint-${{ github.run_attempt }}
          path: data/pxweb_v1/
          retention-days: 7

  build:
    permissions:
      contents: read
      checks: write
    needs: [prepare, collect-refresh]
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.skip == 'false' && (needs.collect-refresh.result == 'success' || needs.prepare.outputs.phase == 'metadata') && (needs.collect-refresh.outputs.providers || needs.prepare.outputs.providers) != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.HARVEST_PARALLEL_PROVIDERS || '19') }}
      matrix:
        provider: ${{ fromJSON(needs.collect-refresh.outputs.providers || needs.prepare.outputs.providers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
          python-version: "3.13"
      - run: uv sync --locked --extra harvest
      - name: Process provider work list
        timeout-minutes: 330
        env:
          PROVIDER: ${{ matrix.provider }}
          RUN_ID: ${{ needs.prepare.outputs.run_id }}
          WAVE: ${{ needs.collect-refresh.outputs.wave || needs.prepare.outputs.wave }}
          GH_TOKEN: ${{ github.token }}
        run: uv run --extra harvest python -m metadata_harvest.monitor run --name "pxweb_v1-build-$PROVIDER" -- python -m metadata_harvest.runner build --provider "$PROVIDER" --run-id "$RUN_ID" --wave "$WAVE"
      - name: Close interrupted progress check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m metadata_harvest.monitor close --conclusion "${{ job.status == 'cancelled' && 'cancelled' || 'failure' }}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telemetry-build-${{ matrix.provider }}-${{ github.run_attempt }}
          path: output/telemetry/
          if-no-files-found: warn
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-${{ matrix.provider }}-${{ github.run_attempt }}
          path: output/provider/
          if-no-files-found: warn
          retention-days: 7

  collect-metadata:
    concurrency:
      group: production-publication
      queue: max
      cancel-in-progress: false
    needs: [prepare, collect-refresh, build]
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.skip == 'false' && (needs.collect-refresh.result == 'success' || needs.prepare.outputs.phase == 'metadata')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
          python-version: "3.13"
      - run: uv sync --locked --extra harvest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: build-*-${{ github.run_attempt }}
          path: output/artifacts
      - id: collect
        env:
          RUN_ID: ${{ needs.prepare.outputs.run_id }}
          WAVE: ${{ needs.collect-refresh.outputs.wave || needs.prepare.outputs.wave }}
        run: uv run --extra harvest python -m metadata_harvest.runner collect-metadata --run-id "$RUN_ID" --wave "$WAVE"
      - name: Commit successful metadata and report
        env:
          RUN_ID: ${{ needs.prepare.outputs.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run --extra harvest python -m metadata_harvest.runner publish --run-id "$RUN_ID"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harvest-checkpoint-${{ github.run_attempt }}
          path: data/pxweb_v1/
          retention-days: 7
      - name: Construct catalog from published results
        id: catalog
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run catalog.yml --ref main
      - name: Continue unfinished work
        if: success() && needs.build.result == 'success' && steps.collect.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.prepare.outputs.run_id }}
        run: uv run --extra harvest python -m metadata_harvest.runner continue --run-id "$RUN_ID"
      - name: Fail only when a whole scope failed
        run: uv run python -m metadata_harvest.outcome --adapter pxweb_v1
      - name: Report catalog dispatch failure
        if: always() && steps.catalog.outcome == 'failure'
        run: exit 1
