name: Live PXWeb metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        provider: [mi, csn, energi, fohm, sjv, konj, konjbar, lansstyr, mcf, slu, skog, domstol, linkoping, kulturanalys, ehm, tillvaxtanalys, vgregion,  sundsvall, skolverket, goteborg, karlstad, orebro, helsingborg, norrkoping, skog_ska22, scb_hvd, ivo, umea, vasteras]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
          python-version: "3.13"
      - run: uv sync --locked --extra harvest
      - run: uv run --extra harvest playwright install --with-deps chromium
      - name: Build metadata for every web-listed table
        timeout-minutes: 340
        run: uv run --extra harvest python scripts/live/check_metadata_live.py --provider "${{ matrix.provider }}" --output "output/metadata/${{ matrix.provider }}.json"
      - name: Retain per-table coverage and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metadata-${{ matrix.provider }}
          path: output/metadata/${{ matrix.provider }}.json
          if-no-files-found: error
          retention-days: 30

  summary:
    if: always()
    needs: providers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
          python-version: "3.13"
      - run: uv sync --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: metadata-*
          merge-multiple: true
          path: output/metadata-live
      - run: uv run python scripts/live/summarize_metadata_live.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metadata-summary
          path: output/metadata-summary.json
          if-no-files-found: error
