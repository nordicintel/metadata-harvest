name: Riksbank metadata

on:
  # BEGIN GENERATED SCHEDULE
  schedule:
    - cron: '15 7 * * 1'
      timezone: Europe/Stockholm
  # END GENERATED SCHEDULE
  workflow_dispatch:
    inputs:
      subjects:
        description: Optional space-separated dataset codes (swea_group_2, mpd_SEQGDPNAYSA, swestr), SWEA group ids or series ids for a bounded run
        default: ''
      languages:
        description: Optional space-separated languages (en) for a bounded run
        default: ''

concurrency:
  group: harvest-riksbank
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  harvest:
    # BEGIN GENERATED ENABLEMENT
    if: github.event_name == 'workflow_dispatch' || true
    # END GENERATED ENABLEMENT
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.7'
          python-version: '3.13'
      - run: uv sync --locked --extra harvest
      - id: run
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECTS: ${{ inputs.subjects }}
          LANGUAGES: ${{ inputs.languages }}
          # Optional API portal key; anonymous access works at about 4 requests/min.
          RIKSBANK_SUBSCRIPTION_KEY: ${{ secrets.RIKSBANK_SUBSCRIPTION_KEY }}
        run: |
          args=()
          if [ -n "$SUBJECTS" ]; then read -ra ids <<< "$SUBJECTS"; args+=(--subject "${ids[@]}"); fi
          if [ -n "$LANGUAGES" ]; then read -ra langs <<< "$LANGUAGES"; args+=(--language "${langs[@]}"); fi
          uv run python -m apps.operations.monitor run --name riksbank -- python -m apps.operations.harvest run --adapter riksbank "${args[@]}"
      - name: Close interrupted progress check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m apps.operations.monitor close --conclusion "${{ job.status == 'cancelled' && 'cancelled' || 'failure' }}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telemetry-riksbank-${{ github.run_attempt }}
          path: output/telemetry/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: riksbank-${{ github.run_attempt }}
          path: output/riksbank/
          if-no-files-found: error
          retention-days: 7

  collect:
    concurrency:
      group: production-publication
      queue: max
      cancel-in-progress: false
    needs: harvest
    if: needs.harvest.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.7'
          python-version: '3.13'
      - run: uv sync --locked --extra harvest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: riksbank-${{ github.run_attempt }}
          path: output/riksbank/
      - id: collect
        run: uv run python -m apps.operations.harvest collect --adapter riksbank
      - name: Publish current Riksbank metadata and errors
        env:
          RUN_ID: ${{ steps.collect.outputs.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run python -m apps.operations.harvest publish --adapter riksbank --run-id "$RUN_ID"
      - name: Construct catalog from published results
        id: catalog
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run catalog.yml --ref main
      - name: Fail only when a whole scope failed
        run: uv run python -m apps.operations.outcome --adapter riksbank
      - name: Report catalog dispatch failure
        if: always() && steps.catalog.outcome == 'failure'
        run: exit 1
