name: Kolada metadata

on:
  # BEGIN GENERATED SCHEDULE
  schedule:
    - cron: '30 6 * * *'
      timezone: Europe/Stockholm
  # END GENERATED SCHEDULE
  workflow_dispatch:
    inputs:
      kpis:
        description: Optional space-separated KPI IDs for a bounded run
        default: ''
      scope:
        description: Scope
        type: choice
        options: [both, municipality, ou]
        default: both
      resume_run:
        description: Internal continuation ID
        default: ''

concurrency:
  group: harvest-kolada
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  harvest:
    # BEGIN GENERATED ENABLEMENT
    if: github.event_name == 'workflow_dispatch' || true
    # END GENERATED ENABLEMENT
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      checks: write
    outputs:
      skip: ${{ steps.run.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.7'
          python-version: '3.13'
      - run: uv sync --locked --extra harvest
      - id: run
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RUN_ID: ${{ inputs.resume_run }}
          KPI_IDS: ${{ inputs.kpis }}
          SCOPE: ${{ inputs.scope }}
        run: |
          args=()
          if [ -n "$KPI_IDS" ]; then read -ra ids <<< "$KPI_IDS"; args+=(--kpi "${ids[@]}"); fi
          if [ -n "$SCOPE" ] && [ "$SCOPE" != both ]; then args+=(--scope "$SCOPE"); fi
          uv run python -m metadata_harvest.monitor run --name kolada -- python -m metadata_harvest.runner run --adapter kolada "${args[@]}"
      - name: Close interrupted progress check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m metadata_harvest.monitor close --conclusion "${{ job.status == 'cancelled' && 'cancelled' || 'failure' }}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telemetry-kolada-${{ github.run_attempt }}
          path: output/telemetry/
          retention-days: 7
      - if: always() && steps.run.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kolada-${{ github.run_attempt }}
          path: output/kolada/
          if-no-files-found: error
          retention-days: 7

  collect:
    concurrency:
      group: production-publication
      queue: max
      cancel-in-progress: false
    needs: harvest
    if: always() && !cancelled() && needs.harvest.result != 'skipped' && needs.harvest.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.7'
          python-version: '3.13'
      - run: uv sync --locked --extra harvest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kolada-${{ github.run_attempt }}
          path: output/kolada/
      - id: collect
        run: uv run python -m metadata_harvest.runner collect --adapter kolada
      - name: Publish current Kolada metadata and errors
        env:
          RUN_ID: ${{ steps.collect.outputs.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run python -m metadata_harvest.runner publish --adapter kolada --run-id "$RUN_ID"
      - name: Construct catalog from published results
        id: catalog
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run catalog.yml --ref main
      - name: Continue unfinished work
        if: steps.collect.outputs.continue == 'true' && needs.harvest.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.collect.outputs.run_id }}
        run: uv run python -m metadata_harvest.runner continue --adapter kolada --run-id "$RUN_ID"
      - name: Report incomplete harvest
        if: steps.collect.outputs.status == 'completed_with_errors' || steps.collect.outputs.status == 'interrupted'
        run: exit 1
      - name: Report catalog dispatch failure
        if: always() && steps.catalog.outcome == 'failure'
        run: exit 1
