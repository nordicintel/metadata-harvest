name: SCB PXWeb v2 metadata

on:
  # BEGIN GENERATED SCHEDULE
  schedule:
    - cron: '15 6 2-14,16-31 * *'
      timezone: Europe/Stockholm
    - cron: '15 6 1,15 * *'
      timezone: Europe/Stockholm
  # END GENERATED SCHEDULE
  workflow_dispatch:
    inputs:
      full:
        description: Refresh every table and referenced codelist
        type: boolean
        default: false
      resume_run:
        description: Internal continuation ID; leave empty for normal manual runs
        required: false
        default: ''

# Enable after complete table acceptance; independent codelist errors remain reported.
concurrency:
  group: harvest-pxweb-v2
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  harvest:
    # BEGIN GENERATED ENABLEMENT
    if: github.event_name == 'workflow_dispatch' || true
    # END GENERATED ENABLEMENT
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      checks: write
    outputs:
      skip: ${{ steps.run.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.7'
          python-version: '3.13'
      - run: uv sync --locked --extra harvest
      - name: Resolve refresh mode from schedule or manual input
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
          MANUAL_FULL: ${{ inputs.full }}
        run: uv run python -m apps.operations.scheduling resolve --adapter pxweb_v2
      - id: run
        name: Discover and harvest SCB sv/en
        timeout-minutes: 330
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RUN_ID: ${{ inputs.resume_run }}
        run: |
          args=()
          if [ "$FULL_REFRESH" = "true" ]; then args+=(--full); fi
          uv run --extra harvest python -m apps.operations.monitor run --name pxweb_v2-scb -- python -m apps.operations.harvest run --adapter pxweb_v2 "${args[@]}"
      - name: Close interrupted progress check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m apps.operations.monitor close --conclusion "${{ job.status == 'cancelled' && 'cancelled' || 'failure' }}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telemetry-pxweb-v2-${{ github.run_attempt }}
          path: output/telemetry/
          if-no-files-found: warn
          retention-days: 7
      - if: always() && steps.run.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pxweb-v2-${{ github.run_attempt }}
          path: output/pxweb_v2/
          if-no-files-found: error
          retention-days: 7

  collect:
    concurrency:
      group: production-publication
      queue: max
      cancel-in-progress: false
    needs: harvest
    if: always() && !cancelled() && needs.harvest.result != 'skipped' && needs.harvest.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.7'
          python-version: '3.13'
      - run: uv sync --locked --extra harvest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pxweb-v2-${{ github.run_attempt }}
          path: output/pxweb_v2/
      - id: collect
        run: uv run --extra harvest python -m apps.operations.harvest collect --adapter pxweb_v2
      - name: Publish validated SCB output and current status
        env:
          RUN_ID: ${{ steps.collect.outputs.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run --extra harvest python -m apps.operations.harvest publish --adapter pxweb_v2 --run-id "$RUN_ID"
      - name: Construct catalog from published results
        id: catalog
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run catalog.yml --ref main
      - name: Continue unfinished work
        if: steps.collect.outputs.continue == 'true' && needs.harvest.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.collect.outputs.run_id }}
        run: uv run --extra harvest python -m apps.operations.harvest continue --adapter pxweb_v2 --run-id "$RUN_ID"
      - name: Fail only when a whole scope failed
        run: uv run python -m apps.operations.outcome --adapter pxweb_v2
      - name: Report catalog dispatch failure
        if: always() && steps.catalog.outcome == 'failure'
        run: exit 1
