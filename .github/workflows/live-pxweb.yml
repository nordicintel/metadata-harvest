name: Live PXWeb compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        provider: [mi, csn, energi, fohm, sjv, konj, konjbar, lansstyr, mcf, slu, skog, domstol, linkoping, kulturanalys, ehm, tillvaxtanalys, vgregion, vasteras, sundsvall, skolverket]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.7"
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - name: Harvest live website and verify API/web inputs and discovery
        run: uv run python scripts/check_pxweb_live.py --provider "${{ matrix.provider }}" --output "output/${{ matrix.provider }}.json"
      - name: Retain live evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pxweb-${{ matrix.provider }}
          path: output/${{ matrix.provider }}.json
          if-no-files-found: error
          retention-days: 30

  summary:
    if: always()
    needs: providers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pxweb-*
          merge-multiple: true
          path: output/live
      - run: python scripts/summarize_pxweb_live.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-summary
          path: output/live-summary.json
          if-no-files-found: error
