name: SMHI emissions metadata

on:
  # BEGIN GENERATED SCHEDULE
  schedule:
    - cron: '30 7 3 * *'
      timezone: Europe/Stockholm
  # END GENERATED SCHEDULE
  workflow_dispatch:
    inputs:
      substances:
        description: Optional space-separated substance codes (such as CO2 NOx) for a bounded run
        default: ''

concurrency:
  group: harvest-smhi-emissions
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  harvest:
    # BEGIN GENERATED ENABLEMENT
    if: github.event_name == 'workflow_dispatch' || true
    # END GENERATED ENABLEMENT
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.7'
          python-version: '3.13'
      - run: uv sync --locked --extra harvest
      - id: run
        env:
          GH_TOKEN: ${{ github.token }}
          SUBSTANCES: ${{ inputs.substances }}
        run: |
          args=()
          if [ -n "$SUBSTANCES" ]; then read -ra ids <<< "$SUBSTANCES"; args+=(--subject "${ids[@]}"); fi
          uv run python -m apps.operations.monitor run --name smhi_emissions -- python -m apps.operations.harvest run --adapter smhi_emissions "${args[@]}"
      - name: Close interrupted progress check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m apps.operations.monitor close --conclusion "${{ job.status == 'cancelled' && 'cancelled' || 'failure' }}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telemetry-smhi_emissions-${{ github.run_attempt }}
          path: output/telemetry/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smhi_emissions-${{ github.run_attempt }}
          path: output/smhi_emissions/
          if-no-files-found: error
          retention-days: 7

  collect:
    concurrency:
      group: production-publication
      queue: max
      cancel-in-progress: false
    needs: harvest
    if: needs.harvest.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.7'
          python-version: '3.13'
      - run: uv sync --locked --extra harvest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: smhi_emissions-${{ github.run_attempt }}
          path: output/smhi_emissions/
      - id: collect
        run: uv run python -m apps.operations.harvest collect --adapter smhi_emissions
      - name: Publish current SMHI emissions metadata and errors
        env:
          RUN_ID: ${{ steps.collect.outputs.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run python -m apps.operations.harvest publish --adapter smhi_emissions --run-id "$RUN_ID"
      - name: Construct catalog from published results
        id: catalog
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A queued catalog run checks out main only when it starts, after this push.
          waiting=$(gh run list --workflow catalog.yml --json status --jq '[.[] | select(.status | IN("requested", "waiting", "pending", "queued"))] | length')
          if [ "$waiting" -gt 0 ]; then echo "A queued catalog run will include this publication"; exit 0; fi
          gh workflow run catalog.yml --ref main
      - name: Fail only when the whole adapter failed
        run: uv run python -m apps.operations.outcome --adapter smhi_emissions
      - name: Report catalog dispatch failure
        if: always() && steps.catalog.outcome == 'failure'
        run: exit 1
