name: EntryScape RowStore metadata

on:
  # BEGIN GENERATED SCHEDULE
  schedule:
    - cron: '30 6 1 * *'
      timezone: Europe/Stockholm
  # END GENERATED SCHEDULE
  workflow_dispatch:
    inputs:
      providers:
        description: Optional space-separated provider codes for a bounded run
        default: ''
      max_requests:
        description: Request budget for this run (one request per second across all hosts)
        default: '1500'

concurrency:
  group: harvest-entrysoft
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  harvest:
    # BEGIN GENERATED ENABLEMENT
    if: github.event_name == 'workflow_dispatch' || true
    # END GENERATED ENABLEMENT
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.7'
          python-version: '3.13'
      - run: uv sync --locked --extra harvest
      - id: run
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDERS: ${{ inputs.providers }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
        run: |
          args=()
          if [ -n "$PROVIDERS" ]; then read -ra ids <<< "$PROVIDERS"; args+=(--provider-code "${ids[@]}"); fi
          if [ -n "$MAX_REQUESTS" ]; then args+=(--max-requests "$MAX_REQUESTS"); fi
          uv run --extra harvest python -m metadata_harvest.monitor run --name entrysoft -- python -m metadata_harvest.runner run --adapter entrysoft "${args[@]}"
      - name: Close interrupted progress check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m metadata_harvest.monitor close --conclusion "${{ job.status == 'cancelled' && 'cancelled' || 'failure' }}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telemetry-entrysoft-${{ github.run_attempt }}
          path: output/telemetry/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: entrysoft-${{ github.run_attempt }}
          path: output/entrysoft/
          if-no-files-found: error
          retention-days: 7

  collect:
    concurrency:
      group: production-publication
      queue: max
      cancel-in-progress: false
    needs: harvest
    if: needs.harvest.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.7'
          python-version: '3.13'
      - run: uv sync --locked --extra harvest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: entrysoft-${{ github.run_attempt }}
          path: output/entrysoft/
      - id: collect
        run: uv run python -m metadata_harvest.runner collect --adapter entrysoft
      - name: Publish current EntryScape metadata and errors
        env:
          RUN_ID: ${{ steps.collect.outputs.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run python -m metadata_harvest.runner publish --adapter entrysoft --run-id "$RUN_ID"
      - name: Construct catalog from published results
        id: catalog
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run catalog.yml --ref main
      - name: Fail only when a whole scope failed
        run: uv run python -m metadata_harvest.outcome --adapter entrysoft
      - name: Report catalog dispatch failure
        if: always() && steps.catalog.outcome == 'failure'
        run: exit 1
