name: Socialstyrelsen analysverktyg metadata

on:
  # BEGIN GENERATED SCHEDULE
  schedule:
    - cron: '45 6 * * 1'
      timezone: Europe/Stockholm
  # END GENERATED SCHEDULE
  workflow_dispatch:
    inputs:
      areas:
        description: Optional space-separated area codes (GONV PS NRAA …) for a bounded run
        default: ''
      indicators:
        description: Optional space-separated indicator codes (G082) or dataset codes (GONV|G082) for a bounded run
        default: ''

concurrency:
  group: harvest-dataanalys
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  harvest:
    # BEGIN GENERATED ENABLEMENT
    if: github.event_name == 'workflow_dispatch' || true
    # END GENERATED ENABLEMENT
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.7'
          python-version: '3.13'
      - run: uv sync --locked --extra harvest
      - id: run
        env:
          GH_TOKEN: ${{ github.token }}
          AREAS: ${{ inputs.areas }}
          INDICATORS: ${{ inputs.indicators }}
        run: |
          args=()
          if [ -n "$AREAS" ]; then read -ra codes <<< "$AREAS"; args+=(--subject "${codes[@]}"); fi
          if [ -n "$INDICATORS" ]; then read -ra codes <<< "$INDICATORS"; args+=(--indicator "${codes[@]}"); fi
          uv run python -m apps.operations.monitor run --name dataanalys -- python -m apps.operations.harvest run --adapter dataanalys "${args[@]}"
      - name: Close interrupted progress check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m apps.operations.monitor close --conclusion "${{ job.status == 'cancelled' && 'cancelled' || 'failure' }}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telemetry-dataanalys-${{ github.run_attempt }}
          path: output/telemetry/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dataanalys-${{ github.run_attempt }}
          path: output/dataanalys/
          if-no-files-found: error
          retention-days: 7

  collect:
    concurrency:
      group: production-publication
      queue: max
      cancel-in-progress: false
    needs: harvest
    if: needs.harvest.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.7'
          python-version: '3.13'
      - run: uv sync --locked --extra harvest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dataanalys-${{ github.run_attempt }}
          path: output/dataanalys/
      - id: collect
        run: uv run python -m apps.operations.harvest collect --adapter dataanalys
      - name: Publish current analysverktyg metadata and errors
        env:
          RUN_ID: ${{ steps.collect.outputs.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run python -m apps.operations.harvest publish --adapter dataanalys --run-id "$RUN_ID"
      - name: Fail only when the whole adapter failed
        run: uv run python -m apps.operations.outcome --adapter dataanalys