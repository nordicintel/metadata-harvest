[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "metadata-harvest"
version = "0.1.0"
description = "Scheduled GitHub Actions to harvest table and dataset metadata from Swedish APIs and databases"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.63.0",
]

[project.urls]
Repository = "https://github.com/nordicintel/metadata-harvest"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.13,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/metadata_harvest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
